<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Download Jarvis</title>
  <meta name="description" content="A test version for invited friends. It runs on your computer.">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="/img/jarvis-mark.svg" type="image/svg+xml">
  <link rel="icon" href="/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="preload" href="/fonts/inter-opsz.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/get/caeb84fe6ae6b7770dd364de7bdfa645/gate.css">
  <script src="/get/caeb84fe6ae6b7770dd364de7bdfa645/gate.js" defer></script>
</head>
<body>
  <main class="gate">
    <div class="gate-in">
      <img class="gate-mark" src="/img/jarvis-mark.svg" alt="" width="48" height="48">
      <h1 class="headline">Download Jarvis</h1>
      <p class="lead">A test version for invited friends. It runs on your computer.</p>

      <form id="gate-form" novalidate>
        <label class="gate-label" for="code">Your code</label>
        <input class="field" id="code" name="code" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" maxlength="80" required aria-describedby="gate-msg">
        <button class="btn" id="continue" type="submit">Continue</button>
        <p class="wl-msg" id="gate-msg" role="status" aria-live="polite"></p>
        <p class="fine" id="gate-tries" hidden></p>
      </form>

      <section id="ready" hidden>
        <h2>Install it</h2>
        <ol class="steps">
          <li><span class="step-n" aria-hidden="true">1</span><span>Click Download and save the file.</span></li>
          <li><span class="step-n" aria-hidden="true">2</span><span>Open the file you saved. If your computer asks you to confirm, say yes.</span></li>
          <li><span class="step-n" aria-hidden="true">3</span><span>Open Jarvis. It stays on your computer.</span></li>
        </ol>
        <a class="btn" id="download" rel="noreferrer">Download Jarvis</a>
      </section>

      <noscript><p class="lead gate-noscript">Turn on JavaScript, then reload this page.</p></noscript>
    </div>
  </main>
</body>
</html>
