<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Logo options — not on the site</title>
  <style>
    body { margin: 0; background: #000; color: #f5f5f7; font: 16px/1.4 "Segoe UI", sans-serif; }
    main { max-width: 880px; margin: 0 auto; padding: 48px 24px 80px; }
    h1 { font-size: 28px; font-weight: 600; letter-spacing: -.03em; }
    p { color: #86868b; max-width: 52ch; }
    .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 36px; }
    article { background: #161617; border-radius: 28px; padding: 28px; }
    h2 { margin: 18px 0 8px; font-size: 20px; }
    .row { display: flex; align-items: end; gap: 28px; }
    img { display: block; }
    .cap { margin-top: 14px; font-size: 13px; color: #86868b; }
    @media (max-width: 700px) { .opts { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Logo options</h1>
    <p>Option B, the J, is the mark on the homepage. Option A is the one that was not chosen.</p>
    <div class="opts">
      <article>
        <div class="row">
          <img src="mark-screen.svg" width="160" height="160" alt="">
          <img src="mark-screen.svg" width="48" height="48" alt="">
          <img src="mark-screen.svg" width="20" height="20" alt="">
        </div>
        <h2>Option A — The screen</h2>
        <p class="cap">A computer, switched on. One shape, one cyan line. No rings.</p>
      </article>
      <article>
        <div class="row">
          <img src="mark-j.svg" width="160" height="160" alt="">
          <img src="mark-j.svg" width="48" height="48" alt="">
          <img src="mark-j.svg" width="20" height="20" alt="">
        </div>
        <h2>Option B — The J</h2>
        <p class="cap">A geometric J with a cyan stop. The name, without a reactor.</p>
      </article>
    </div>
  </main>
</body>
</html>
